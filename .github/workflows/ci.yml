name: CI

# PR 与 main 共用一条流水线：测试全部通过后，main 上版本号比已发布版本新时才构建并发布。
# PR 验证真实双架构安装包；仅已发布版本的纯文档改动跳过打包。正式密钥只在 release 使用。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 手动运行：测试并构建 DMG，不发布
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: '2.11.4'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # 只取消旧的 PR 运行；main 上正在进行的发布不被打断
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check frontend syntax
        run: |
          node --check frontend/app.js
          node --check frontend/updater.js

      - name: Run frontend regression tests
        run: |
          mkdir -p test-results
          node --test scripts/test-*.cjs 2>&1 | tee test-results/frontend.log

      - name: Run update feed and release plan tests
        run: |
          mkdir -p test-results
          # Desktop fixture ownership is deliberately restricted to /private/tmp.
          # Ubuntu runners do not provide macOS's directory layout by default.
          sudo install -d -m 1777 /private/tmp
          python3 scripts/test-update-manifest.py 2>&1 | tee test-results/update-manifest.log
          python3 scripts/test-release-plan.py 2>&1 | tee test-results/release-plan.log
          python3 scripts/test-publish-release.py 2>&1 | tee test-results/publish-release.log
          python3 scripts/test-update-artifacts.py 2>&1 | tee test-results/update-artifacts.log

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-tests-${{ github.sha }}
          path: test-results/
          retention-days: 30

  backend:
    name: Backend and installer (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Run backend regression tests
        run: |
          mkdir -p test-results
          (cd src-tauri && cargo test --locked --lib) 2>&1 | tee test-results/backend.log

      - name: Test macOS installer and recovery
        run: |
          mkdir -p test-results
          bash scripts/test-macos-installer.sh 2>&1 | tee test-results/installer.log

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-tests-${{ github.sha }}
          path: test-results/
          retention-days: 30

  plan:
    name: Release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      newer: ${{ steps.plan.outputs.newer }}
      build_required: ${{ steps.policy.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # 校验三处版本号一致，并与已发布的 Release 和已有标签比较
      - name: Compare with published releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # PR 上比较 PR 自己的提交，而不是临时合并提交
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/release-plan.py

      - name: Require release notes for the new version
        if: steps.plan.outputs.newer == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for notes in docs/release-notes.md docs/update-notes.txt; do
            if ! grep -qF "v$VERSION" "$notes"; then
              echo "$notes 还没有写 v$VERSION 的说明" >&2
              exit 1
            fi
          done

      - name: Decide whether packaging is required
        id: policy
        env:
          CI_NEWER: ${{ steps.plan.outputs.newer }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-policy.cjs

  build:
    name: Build DMG (${{ matrix.arch }})
    needs: [frontend, backend, plan]
    if: needs.plan.outputs.build_required == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 原生构建 arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          # Intel 原生构建 x64（macos-13 已退役；macos-15-intel / macos-26-intel 是当前 GA 的 Intel 标签）
          # 若将来 Intel 标签也退役，改为在 arm64 上交叉编译：rustup target add x86_64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos-build
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Test macOS installer and recovery
        run: |
          mkdir -p test-results
          bash scripts/test-macos-installer.sh 2>&1 | tee test-results/installer.log

      - uses: ./.github/actions/setup-tauri-cli

      - name: Run backend regression tests on this architecture
        run: |
          (cd src-tauri && cargo test --locked --release --lib --target ${{ matrix.target }}) 2>&1 | tee test-results/backend-release.log

      - name: Build application
        run: |
          (cd src-tauri && cargo tauri build --bundles app --target ${{ matrix.target }}) 2>&1 | tee test-results/build.log

      - name: Build graphical installer DMG
        run: |
          mkdir -p dist
          bash scripts/build-macos-installer.sh \
            "$PWD/src-tauri/target/${{ matrix.target }}/release/bundle/macos/声场档案.app" \
            "$PWD/dist/music-manager_${VERSION}_${{ matrix.arch }}.dmg" 2>&1 | tee test-results/dmg.log

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-${{ matrix.arch }}-${{ github.sha }}
          path: dist/music-manager_${{ needs.plan.outputs.version }}_${{ matrix.arch }}.dmg*
          if-no-files-found: error
          retention-days: 30

      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ matrix.arch }}-${{ github.sha }}
          path: test-results/
          retention-days: 30

  preview:
    name: Release rehearsal (temporary key)
    needs: [plan, build]
    if: needs.plan.outputs.build_required == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos-build
          key: aarch64-apple-darwin
          cache-on-failure: true
      - uses: ./.github/actions/setup-tauri-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Rehearse signing, verification and update feed
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/rehearsal.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          cargo tauri signer generate --ci --password '' --write-keys "$TAURI_SIGNING_PRIVATE_KEY_PATH" > /dev/null
          python3 scripts/prepare-release.py --version "$VERSION" --directory dist \
            --public-key "$TAURI_SIGNING_PRIVATE_KEY_PATH.pub" --notes docs/update-notes.txt --target aarch64-apple-darwin
          # Re-running must preserve the exact candidate bytes, including signatures and timestamps.
          python3 -c 'import hashlib,pathlib; print([(p.name,hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(pathlib.Path("dist").iterdir())])' > "$RUNNER_TEMP/candidate-before"
          python3 scripts/prepare-release.py --version "$VERSION" --directory dist \
            --public-key "$TAURI_SIGNING_PRIVATE_KEY_PATH.pub" --notes docs/update-notes.txt --target aarch64-apple-darwin
          python3 -c 'import hashlib,pathlib; print([(p.name,hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(pathlib.Path("dist").iterdir())])' > "$RUNNER_TEMP/candidate-after"
          cmp "$RUNNER_TEMP/candidate-before" "$RUNNER_TEMP/candidate-after"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rehearsal.key" "$RUNNER_TEMP/rehearsal.key.pub"

  ready:
    name: CI Ready
    if: always()
    needs: [frontend, backend, plan, build, preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all expected results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.cjs --check

  release:
    name: Release
    needs: [plan, build, ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.newer == 'true'
    # 校验更新签名的 verify-update 只能在 macOS 上编译
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # gh release create 用这个 token 创建标签和 Release
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "请先配置仓库 Secret TAURI_SIGNING_PRIVATE_KEY；拒绝发布无法验证的更新。" >&2
            exit 1
          fi

      # 构建期间可能已有其他发布，发布前再确认一次
      - name: Verify legacy client repository redirect
        run: |
          actual="$(gh api repos/AI-AQI/music-manager --jq .full_name)"
          if [[ "$actual" != "$GITHUB_REPOSITORY" ]]; then
            echo "旧客户端仓库地址不再指向本仓库，拒绝发布不可升级的清单" >&2
            exit 1
          fi

      - name: Recheck release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py --require-newer

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos-build
          key: aarch64-apple-darwin
          cache-on-failure: true

      - uses: ./.github/actions/setup-tauri-cli

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Find saved signed candidate from this run
        id: saved
        run: python3 scripts/prepare-release.py --find-saved

      - name: Restore original signed candidate for retry
        if: steps.saved.outputs.candidate_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.saved.outputs.candidate_id }}
          path: dist
          merge-multiple: true

      - name: Sign and verify update packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          python3 scripts/prepare-release.py --version "$VERSION" --directory dist \
            --public-key src-tauri/updater-trusted-public-key.txt --notes docs/update-notes.txt --target aarch64-apple-darwin

      - name: Preserve signed candidate before publishing
        if: steps.saved.outputs.candidate_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # gh 会把 --notes-file 的内容放在自动生成的 release notes 之前
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-release.py --version "$VERSION" --directory dist --notes docs/release-notes.md
