name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

# 同一分支或 tag 只保留最新一次运行，避免重复推送 tag 时并发修改同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          tauri_version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n 1)"

          if [[ -z "$cargo_version" || -z "$tauri_version" ]]; then
            echo "无法读取 Cargo.toml 或 tauri.conf.json 中的版本号" >&2
            exit 1
          fi

          if [[ "$cargo_version" != "$tauri_version" ]]; then
            echo "版本不一致：Cargo.toml=$cargo_version, tauri.conf.json=$tauri_version" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" == "$tag_version" || "$tag_version" != "$cargo_version" ]]; then
              echo "版本不一致：tag=$GITHUB_REF_NAME, 应用版本=$cargo_version" >&2
              exit 1
            fi
          fi

          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

      - name: Check frontend database startup and switching
        run: |
          node --check frontend/app.js
          node --check frontend/updater.js
          node --test scripts/test-*.cjs
          python3 scripts/test-update-manifest.py

  # 按 CPU 架构分两个原生 runner 构建，避免交叉编译的坑
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 原生构建 arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          # Intel 原生构建 x64（macos-13 已退役；macos-15-intel / macos-26-intel 是当前 GA 的 Intel 标签）
          # 若将来 Intel 标签也退役，改为在 arm64 上交叉编译：rustup target add x86_64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "请先配置仓库 Secret TAURI_SIGNING_PRIVATE_KEY；拒绝发布无法验证的更新。" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # CI 里没有 cargo-tauri，需要单独装；版本与本地保持一致，必要时升级
      - name: Test macOS installer and recovery
        run: bash scripts/test-macos-installer.sh

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Run backend regression tests
        run: cargo test --locked --release --lib --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Build application
        run: cargo tauri build --bundles app --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Build graphical installer DMG
        id: rename
        run: |
          asset="music-manager_${{ needs.validate.outputs.version }}_${{ matrix.arch }}.dmg"
          bash scripts/build-macos-installer.sh \
            "$PWD/src-tauri/target/${{ matrix.target }}/release/bundle/macos/声场档案.app" \
            "$PWD/$asset"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify update package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          cargo tauri signer sign "${{ steps.rename.outputs.asset }}"
          cargo run --locked --release --manifest-path src-tauri/Cargo.toml --example verify-update -- \
            "${{ steps.rename.outputs.asset }}" "${{ steps.rename.outputs.asset }}.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: music-manager-${{ matrix.arch }}
          path: |
            ${{ steps.rename.outputs.asset }}
            ${{ steps.rename.outputs.asset }}.sig
          if-no-files-found: error

  # 打 tag 时才创建 release；workflow_dispatch 只用来测试构建、不发布
  release:
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create signed-package update feed
        run: python3 scripts/create-update-manifest.py --version "${{ needs.validate.outputs.version }}" --directory dist --notes docs/update-notes.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.sig
            dist/latest.json
            scripts/install-macos.sh
          generate_release_notes: true
          # 加了 body 后，它会被放在自动生成的 release notes 之前
          body: |
            ### v0.2.7 · 猫咪音乐角落

            - 新增「奶油留白 / 月夜打盹」双主题猫咪首页、呼吸与抚摸反馈、柔和主题切换及猫咪图标。沙发进入音乐库，地毯进入最近播放，毛线球进入音乐片段。
            - 优化首页试听、切歌取消、播放队列、连续保存与导入交互；波形随主题重绘，音频读取失败后可重试，不产生未处理的 Promise 拒绝。
            - WAV 导出禁止覆盖原始音频，完成后原子保存，失败保留已有输出；专辑标签写入使用事务，改进标签统计和专辑移动、拆分、交换时的标签保留。
            - 离线音频可继续编辑资料；微动效可关闭，并遵循系统减少动态效果偏好。

            ### 旧用户升级：继续使用原来的数据库

            本版只替换应用，保留 `settings.json`、原 `library.db` 路径和原始音频。音乐、标签、片段、专辑标签和候选清单继续使用，无需重建音乐库或重新导入。数据库 schema 保持为 3。

            - v0.2.6 用户可从设置中的检查更新入口下载并重启安装；较早版本使用下方图形化安装器。
            - 旧版缺少位置配置时，选择“打开已有音乐库”，指向原 `library.db` 所在文件夹。旧默认库位于 `~/Library/Application Support/com.musicmanager.app/library.db`。
            - 移动硬盘未连接或数据库缺失时等待重试，不创建替代空库。删除音乐或片段只删除记录，不删除音频。
            - 更新包经过数字签名校验；安装器支持启动重试、兼容性检查后的旧版恢复和诊断信息导出。安装失败时保留原应用备份和音乐库。

            ### 下载文件

            请根据你的 Mac 芯片下载对应的 DMG：

            | 设备 | 下载文件 |
            | --- | --- |
            | M1 / M2 / M3 / M4 等 Apple Silicon Mac | `music-manager_${{ needs.validate.outputs.version }}_aarch64.dmg` |
            | Intel Mac | `music-manager_${{ needs.validate.outputs.version }}_x64.dmg` |

            ### 安装

            安装包使用免费的 ad-hoc（临时）签名，未进行 Apple Developer ID 签名或公证。macOS 仍可能要求首次手动允许打开。

            1. 打开 DMG，双击“安装与更新声场档案”。
            2. 点击“安装 / 更新”，等待窗口显示启动结果。首次安装到当前用户的“应用程序”文件夹；已有应用保持原位置，必要时系统会要求管理员授权。
            3. 若 macOS 首次阻止安装器打开，请在“系统设置 → 隐私与安全性”允许打开。
            4. 失败时点击“重新尝试启动”“恢复旧版”或“导出诊断信息”。请保留 DMG，后续仍可使用安装窗口。

            免费临时签名不代表完成 Apple 公证；首次打开仍可能需要手动允许。

            `install-macos.sh` 仅作为旧命令的兼容入口，`--replace` 会打开同一个安装窗口，不再直接删除或覆盖旧应用。旧 DMG 不含图形化入口时会停止并提示下载新版。

            ### 注意

            - 删除音乐或片段只会移除软件中的记录，不会删除原始音频文件。
            - 当前安装脚本用于小范围测试；顺畅的正式站外分发需要 Apple Developer ID 签名与公证，首次打开仍可能有普通的下载确认提示。
          # 想先人工确认再发，就打开下面这行：
          # draft: true
          # 预发布版本（如 v0.1.0-beta.1）打开下面这行：
          # prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
